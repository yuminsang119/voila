<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대전 병원·약국 찾기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Noto Sans KR', sans-serif; overflow: hidden; height: 100dvh; }

    /* ── 지도 (전체 화면) ─────────────────────────── */
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── 헤더 ────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 200;
      background: linear-gradient(135deg, #2b6cb0, #3182ce);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; }

    /* ── 검색 패널 (헤더 바로 아래 고정) ─────────── */
    .search-panel {
      position: fixed;
      top: 52px; left: 0; right: 0;
      z-index: 200;
      padding: 10px 12px 8px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-kind {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .1s;
    }
    .btn-kind:active { transform: scale(.97); }
    .btn-hospital { background: #ebf8ff; color: #2b6cb0; }
    .btn-pharmacy { background: #f0fff4; color: #276749; }

    .radius-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .radius-row::-webkit-scrollbar { display: none; }
    .radius-row button {
      flex-shrink: 0;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid #cbd5e0;
      background: white;
      font-size: 0.8rem;
      cursor: pointer;
      color: #4a5568;
      transition: all .15s;
    }
    .radius-row button.active {
      border-color: #3182ce;
      background: #ebf8ff;
      color: #2b6cb0;
      font-weight: 700;
    }

    /* ── 바텀시트 ─────────────────────────────────── */
    .bottom-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 300;
      background: white;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.18);
      max-height: 68vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }
    /* 드래그 핸들 */
    .sheet-handle {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 28px;
      cursor: grab;
      touch-action: none;
    }
    .sheet-handle::before {
      content: '';
      width: 40px; height: 4px;
      background: #cbd5e0;
      border-radius: 2px;
    }
    .sheet-top {
      flex-shrink: 0;
      padding: 0 16px 10px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .sheet-title { font-size: 1rem; font-weight: 700; color: #1a202c; }
    .sheet-sub   { font-size: 0.78rem; color: #718096; }

    /* 카드 스크롤 영역 */
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 14px 32px;
    }

    /* ── 카드 ─────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      animation: cardUp 0.3s ease both;
    }
    .card.highlight {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px #bee3f8;
    }
    @keyframes cardUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1a202c;
      line-height: 1.3;
    }
    .dist-badge {
      font-size: 0.7rem;
      color: #a0aec0;
      font-weight: 400;
      margin-left: 4px;
    }
    .badge-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 700;
    }
    .badge-open   { background: #c6f6d5; color: #276749; }
    .badge-closed { background: #fed7d7; color: #9b2c2c; }
    .badge-emg    { background: #fed7d7; color: #9b2c2c; }
    .badge-duty   { background: #fefcbf; color: #744210; }

    .card-meta {
      font-size: 0.79rem;
      color: #4a5568;
      line-height: 1.7;
    }
    .card-meta span { display: block; }
    .card-meta a { color: #276749; text-decoration: none; font-weight: 600; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .card-actions a {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.79rem;
      font-weight: 700;
      text-decoration: none;
      transition: opacity .15s;
    }
    .card-actions a:active { opacity: .7; }
    .btn-map  { background: #ebf8ff; color: #2b6cb0; }
    .btn-call { background: #f0fff4; color: #276749; }

    /* 장비·전문의 토글 영역 */
    .detail-toggle {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #3182ce;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .detail-toggle::before { content: '▶ '; font-size: 0.65rem; }
    .detail-toggle.open::before { content: '▼ '; }
    .detail-body {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #edf2f7;
    }
    .detail-body.open { display: block; }
    .detail-section { margin-bottom: 6px; }
    .detail-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #718096;
      margin-bottom: 4px;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chip-equip { background: #ebf8ff; color: #2b6cb0; }
    .chip-spec  { background: #f0fff4; color: #276749; }

    /* ── 바텀시트 필터 바 ──────────────────────────── */
    .filter-bar {
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 0 14px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-bar.visible { display: flex; }
    .filter-chip {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid #e2e8f0;
      background: white;
      font-size: 0.76rem;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: #2b6cb0;
      border-color: #2b6cb0;
      color: white;
    }
    .filter-chip.active.emg  { background: #c53030; border-color: #c53030; }
    .filter-chip.active.duty { background: #b7791f; border-color: #b7791f; }

    /* ── 0건 결과 안내 ─────────────────────────────── */
    .empty-state {
      padding: 24px 16px;
      text-align: center;
      color: #718096;
    }
    .empty-state p { font-size: 0.88rem; margin-bottom: 14px; line-height: 1.6; }
    .btn-expand {
      display: inline-block;
      padding: 10px 22px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-expand:active { opacity: .8; }

    /* ── 토스트 메시지 ─────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(26,32,44,.9);
      color: white;
      padding: 9px 18px;
      border-radius: 22px;
      font-size: 0.84rem;
      opacity: 0;
      pointer-events: none;
      z-index: 500;
      white-space: nowrap;
      max-width: 90vw;
      transition: opacity .25s, transform .25s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* 재시도 토스트 (위치 오류용) */
    #retryToast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(26,32,44,.95);
      color: white;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      opacity: 0;
      pointer-events: none;
      z-index: 500;
      max-width: 88vw;
      text-align: center;
      line-height: 1.5;
      transition: opacity .25s, transform .25s;
    }
    #retryToast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #retryToast button {
      margin-top: 8px;
      display: block;
      width: 100%;
      padding: 7px;
      border: none;
      border-radius: 8px;
      background: #3182ce;
      color: white;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── 스피너 ───────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 내 위치 마커 ─────────────────────────────── */
    .my-dot {
      width: 16px; height: 16px;
      background: #3182ce;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(49,130,206,.35), 0 2px 6px rgba(0,0,0,.4);
    }

    /* ── 핀 마커 ─────────────────────────────────── */
    .pin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pin-circle {
      width: 32px; height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,.35);
    }
    .pin-emoji {
      transform: rotate(45deg);
      font-size: 14px;
      line-height: 1;
    }
    .pin-tail {
      width: 2px; height: 6px;
      background: inherit;
      margin-top: -1px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<header>
  <h1>🏥 대전 병원·약국 찾기</h1>
</header>

<div class="search-panel">
  <div class="btn-row">
    <button class="btn-kind btn-hospital" onclick="search('hospital')">🏥 병원 찾기</button>
    <button class="btn-kind btn-pharmacy" onclick="search('pharmacy')">💊 약국 찾기</button>
  </div>
  <div class="radius-row" id="radiusBtns">
    <button onclick="setRadius(1)">1 km</button>
    <button onclick="setRadius(3)" class="active">3 km</button>
    <button onclick="setRadius(5)">5 km</button>
    <button onclick="setRadius(10)">10 km</button>
  </div>
</div>

<!-- 바텀시트 -->
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle"></div>
  <div class="sheet-top">
    <span class="sheet-title" id="sheetTitle">검색 결과</span>
    <span class="sheet-sub"   id="sheetSub"></span>
  </div>
  <!-- 필터 바 -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-chip" id="chipOpen"  onclick="toggleFilter('open')">영업중만</button>
    <button class="filter-chip" id="chipEmg"   onclick="toggleFilter('emg')">🚨 응급실</button>
    <button class="filter-chip" id="chipDuty"  onclick="toggleFilter('duty')">🌙 야간·당번</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast"></div>
<div id="retryToast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── 지도 초기화 ────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false })
              .setView([36.3504, 127.3845], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

// ── 상태 ───────────────────────────────────────────────────────────────
let radiusKm      = 3;
let myMarker      = null;
let markers       = {};   // cardIndex → L.Marker
let toastTimer    = null;
let retryTimer    = null;
let lastSearchKind = null;  // 마지막 검색 종류 (hospital / pharmacy)
let lastPos        = null;  // 마지막 위치 {lat, lon}
let allItems       = [];    // 현재 결과 전체
let activeFilters  = new Set();  // 활성 필터 집합

// ── 토스트 ────────────────────────────────────────────────────────────
function toast(msg, ms = 2600) {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// 위치 오류 전용 재시도 토스트 (버튼 포함)
function showRetryToast(msg) {
  const el = document.getElementById('retryToast');
  el.innerHTML = `${msg}<button onclick="hideRetryToast(); search(lastSearchKind || 'hospital')">🔄 다시 시도</button>`;
  el.classList.add('show');
  clearTimeout(retryTimer);
  retryTimer = setTimeout(hideRetryToast, 8000);
}
function hideRetryToast() {
  document.getElementById('retryToast').classList.remove('show');
}

// ── 반경 선택 ─────────────────────────────────────────────────────────
function setRadius(km) {
  radiusKm = km;
  document.querySelectorAll('#radiusBtns button').forEach(b =>
    b.classList.toggle('active', b.textContent.trim() === km + ' km')
  );
  // 이전 검색이 있으면 즉시 재검색
  if (lastSearchKind && lastPos) {
    activeFilters.clear();
    updateFilterChips();
    fetchNearby(lastPos.lat, lastPos.lon, lastSearchKind);
  }
}

// ── 필터 토글 ─────────────────────────────────────────────────────────
function toggleFilter(key) {
  if (activeFilters.has(key)) activeFilters.delete(key);
  else activeFilters.add(key);
  updateFilterChips();
  applyFilters();
}

function updateFilterChips() {
  document.getElementById('chipOpen').classList.toggle('active', activeFilters.has('open'));
  document.getElementById('chipEmg').classList.toggle('active', activeFilters.has('emg'));
  document.getElementById('chipDuty').classList.toggle('active', activeFilters.has('duty'));
  document.getElementById('chipEmg').classList.toggle('emg', activeFilters.has('emg'));
  document.getElementById('chipDuty').classList.toggle('duty', activeFilters.has('duty'));
}

function applyFilters() {
  let items = allItems;
  if (activeFilters.has('open'))  items = items.filter(x => x.is_open);
  if (activeFilters.has('emg'))   items = items.filter(x => x.emergency);
  if (activeFilters.has('duty'))  items = items.filter(x => x.duty_pharmacy || x.emergency);
  renderCards(items);
}

// ── 바텀시트 토글 ─────────────────────────────────────────────────────
const sheet = document.getElementById('sheet');
function openSheet()  { sheet.classList.add('open'); }
function closeSheet() { sheet.classList.remove('open'); }

// 드래그 내려서 닫기
(function () {
  const handle = document.getElementById('sheetHandle');
  let startY = 0, dragging = false;

  handle.addEventListener('touchstart', e => {
    dragging = true;
    startY = e.touches[0].clientY;
    sheet.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    sheet.style.transform = '';
    if (dy > 80) closeSheet();
  });
})();

// ── 지도 핀 아이콘 생성 ───────────────────────────────────────────────
function makePin(bg, emoji) {
  const html = `
    <div class="pin-wrap">
      <div class="pin-circle" style="background:${bg}">
        <span class="pin-emoji">${emoji}</span>
      </div>
    </div>`;
  return L.divIcon({
    className: '',
    html,
    iconSize:   [32, 38],
    iconAnchor: [16, 38],
    popupAnchor:[0, -40],
  });
}

// ── 검색 ─────────────────────────────────────────────────────────────
function search(kind) {
  lastSearchKind = kind;
  hideRetryToast();
  toast('<span class="spinner"></span>위치 정보를 가져오는 중...', 10000);

  if (!navigator.geolocation) {
    toast('⚠️ 위치 서비스를 지원하지 않는 브라우저입니다.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => fetchNearby(pos.coords.latitude, pos.coords.longitude, kind),
    err => {
      const m = {
        1: '주소창 왼쪽 자물쇠 아이콘을 눌러 위치 권한을 허용해 주세요.',
        2: '⚠️ 위치를 가져오지 못했습니다.',
        3: '⚠️ 위치 요청 시간이 초과되었습니다.',
      };
      showRetryToast(m[err.code] || '⚠️ 알 수 없는 오류');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function fetchNearby(lat, lon, kind) {
  lastPos = { lat, lon };
  const label = kind === 'hospital' ? '병원' : '약국';
  toast(`<span class="spinner"></span>반경 ${radiusKm}km ${label} 검색 중...`, 10000);

  // 내 위치 마커
  if (myMarker) map.removeLayer(myMarker);
  myMarker = L.marker([lat, lon], {
    icon: L.divIcon({ className: '', html: '<div class="my-dot"></div>', iconSize: [16,16], iconAnchor: [8,8] }),
  }).addTo(map).bindPopup('📍 현재 위치');

  try {
    const res  = await fetch(`/api/nearby?lat=${lat}&lon=${lon}&kind=${kind}&radius=${radiusKm}`);
    const data = await res.json();
    render(data, label, lat, lon);
  } catch {
    toast('⚠️ 서버 연결 실패. 잠시 후 다시 시도해 주세요.');
  }
}

// ── 렌더링 ─────────────────────────────────────────────────────────────
function render(data, label, myLat, myLon) {
  // 이전 마커 제거
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  activeFilters.clear();
  updateFilterChips();

  const isHosp = label === '병원';

  if (!data.items || data.items.length === 0) {
    // 0건 → 바텀시트에 반경 확대 제안 표시
    const radii = [1, 3, 5, 10];
    const nextRadius = radii.find(r => r > radiusKm);
    document.getElementById('sheetTitle').textContent = `검색 결과 없음`;
    document.getElementById('sheetSub').textContent   = `반경 ${radiusKm}km · ${label}`;
    document.getElementById('filterBar').classList.remove('visible');
    const body = document.getElementById('sheetBody');
    body.innerHTML = `<div class="empty-state">
      <p>반경 ${radiusKm}km 이내에<br>${label}이 없습니다.</p>
      ${nextRadius ? `<button class="btn-expand" onclick="expandAndSearch(${nextRadius})">반경 ${nextRadius}km로 확대해서 찾기</button>` : '<p>반경을 최대로 늘렸지만 결과가 없습니다.</p>'}
    </div>`;
    setTimeout(openSheet, 120);
    return;
  }

  // 전체 데이터 저장 (필터용)
  allItems = data.items;

  document.getElementById('sheetTitle').textContent = `${label} ${data.items.length}건`;
  document.getElementById('sheetSub').textContent   = `가까운 순 · 반경 ${radiusKm}km`;
  document.getElementById('filterBar').classList.add('visible');

  // 지도 핀 렌더링
  const bounds = [[myLat, myLon]];
  data.items.forEach((item, i) => {
    const color = item.is_open
      ? (isHosp ? '#3182ce' : '#38a169')
      : '#a0aec0';
    const emoji = isHosp ? '🏥' : '💊';
    if (item.latitude && item.longitude) {
      const mk = L.marker([item.latitude, item.longitude], { icon: makePin(color, emoji) })
        .addTo(map)
        .bindPopup(`<b>${item.name}</b><br>${item.dist_km} km`);
      mk.on('click', () => scrollToCard(i));
      markers[i] = mk;
      bounds.push([item.latitude, item.longitude]);
    }
  });

  renderCards(data.items);

  // 결과 전체가 보이도록 지도 범위 조정
  map.fitBounds(bounds, { padding: [70, 70], maxZoom: 15 });

  // 바텀시트 슬라이드 업
  setTimeout(openSheet, 120);
  toast(`${data.items.length}개 ${label}을 찾았어요!`);
}

// ── 카드 목록 렌더링 (필터 후 재호출 가능) ────────────────────────────
function renderCards(items) {
  const isHosp = lastSearchKind === 'hospital';
  const body = document.getElementById('sheetBody');
  body.innerHTML = '';

  if (items.length === 0) {
    body.innerHTML = '<div class="empty-state"><p>조건에 맞는 결과가 없습니다.<br>필터를 해제해 보세요.</p></div>';
    return;
  }

  items.forEach((item, i) => {
    const origIdx = allItems.indexOf(item);
    const mapUrl  = `https://map.kakao.com/link/map/${encodeURIComponent(item.name)},${item.latitude},${item.longitude}`;
    const callUrl = item.phone ? `tel:${item.phone.replace(/-/g, '')}` : '#';

    const openBadge = item.is_open
      ? '<span class="badge badge-open">✅ 영업중</span>'
      : '<span class="badge badge-closed">❌ 휴진</span>';
    const emgBadge  = item.emergency     ? '<span class="badge badge-emg">🚨응급</span>'  : '';
    const dutyBadge = item.duty_pharmacy ? '<span class="badge badge-duty">🌙당번</span>' : '';

    const eqChips = (item.equipment || [])
      .map(e => `<span class="chip chip-equip">${e}</span>`).join('');
    const spChips = Object.entries(item.specialists || {})
      .map(([sp, n]) => `<span class="chip chip-spec">${sp} ${n}명</span>`).join('');

    const detailSection = (eqChips || spChips) ? `
      <div class="detail-toggle" onclick="toggleDetail(this, event)">장비·전문의 보기</div>
      <div class="detail-body">
        ${eqChips ? `<div class="detail-section"><div class="detail-label">🩻 보유 장비</div><div class="chip-row">${eqChips}</div></div>` : ''}
        ${spChips ? `<div class="detail-section"><div class="detail-label">👨‍⚕️ 전문의</div><div class="chip-row">${spChips}</div></div>` : ''}
      </div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${origIdx}`;
    card.style.animationDelay = `${i * 45}ms`;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${item.name}<span class="dist-badge">${item.dist_km} km</span></div>
          <div class="badge-row">${emgBadge}${dutyBadge}${openBadge}</div>
        </div>
      </div>
      <div class="card-meta">
        <span>📍 ${item.address || '-'}</span>
        <span>⏰ ${item.hours || '-'}</span>
        ${item.phone ? `<span>📞 <a href="${callUrl}" onclick="event.stopPropagation()">${item.phone}</a></span>` : ''}
      </div>
      ${detailSection}
      ${(item.latitude || item.phone) ? `
      <div class="card-actions">
        ${item.latitude ? `<a href="${mapUrl}" target="_blank" class="btn-map" onclick="event.stopPropagation()">🗺 지도 보기</a>` : ''}
        ${item.phone    ? `<a href="${callUrl}" class="btn-call" onclick="event.stopPropagation()">📞 전화하기</a>` : ''}
      </div>` : ''}`;

    card.addEventListener('click', () => flyTo(origIdx, item));
    body.appendChild(card);
  });
}

// ── 반경 확대 후 재검색 ────────────────────────────────────────────────
function expandAndSearch(km) {
  radiusKm = km;
  document.querySelectorAll('#radiusBtns button').forEach(b =>
    b.classList.toggle('active', b.textContent.trim() === km + ' km')
  );
  if (lastPos) fetchNearby(lastPos.lat, lastPos.lon, lastSearchKind);
}

// ── 장비·전문의 토글 ──────────────────────────────────────────────────
function toggleDetail(btn, e) {
  e.stopPropagation();
  const body = btn.nextElementSibling;
  const open = body.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '장비·전문의 접기' : '장비·전문의 보기';
}

// ── 카드 → 지도 포커스 ───────────────────────────────────────────────
function flyTo(i, item) {
  if (!item.latitude || !item.longitude) return;
  map.flyTo([item.latitude, item.longitude], 17, { duration: 0.7 });
  setTimeout(() => markers[i] && markers[i].openPopup(), 750);
}

// ── 지도 핀 클릭 → 카드 스크롤 ─────────────────────────────────────
function scrollToCard(i) {
  const card = document.getElementById(`card-${i}`);
  if (!card) return;
  openSheet();
  setTimeout(() => {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 1400);
  }, 150);
}
</script>
